# Workflow definitions are developer-facing config, so step names stay in
# English per the language rule in CLAUDE.md.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-flight run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (offline suite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-core.txt

      # Runs before installing anything: --check only needs hashlib and
      # argparse from the stdlib. Catches vendor/ being edited without
      # rerunning scripts/vendor.py.
      - name: Verify vendored dependency integrity
        run: python scripts/vendor.py --check

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
          pip install pytest

      # Only app/core/ and app/cli.py are under test; PySide6 is
      # deliberately not installed, per the layering rule in CLAUDE.md.
      - name: Run offline test suite
        run: pytest -m "not smtp" -v

      - name: Check the CLI starts
        run: python -m app.cli --version
