CL-Email-Scraper/
│
├── app/
│   ├── __init__.py
│   ├── main.py                    # entry point, QApplication
│   │
│   ├── core/                      # pure business logic, no Qt
│   │   ├── __init__.py
│   │   ├── crawler.py             # httpx async crawler, phase 1/2 logic
│   │   ├── extractor.py           # email regex + obfuscation detection
│   │   ├── verifier.py            # syntax → MX → SMTP → API pipeline
│   │   ├── exporter.py            # CSV/JSON/HTML export, auto-Desktop path
│   │   └── session.py             # SQLite session store, last 10 runs
│   │
│   ├── ui/                        # all PySide6 widgets
│   │   ├── __init__.py
│   │   ├── main_window.py         # top-level window, splitter layout
│   │   ├── control_panel.py       # wizard fields + Start/Pause/Stop buttons
│   │   ├── terminal_panel.py      # white-bg monospace email feed
│   │   └── results_table.py       # traffic-light table, shown post-verify
│   │
│   └── workers/                   # QThread wrappers (keep Qt off core/)
│       ├── __init__.py
│       ├── crawler_worker.py      # runs asyncio crawl in background thread
│       └── verifier_worker.py     # runs verifier batch, emits progress
│
├── tests/
│   ├── __init__.py
│   ├── test_extractor.py          # mailto, plain-text, obfuscation, non-.cl
│   └── test_verifier.py           # syntax pass/fail
│
├── assets/                        # icon.ico / icon.icns go here
